[project]
name = "invoiceiq"
version = "0.1.0"
description = "InvoiceIQ backend — EU-first AI accounts payable platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "celery>=5.4",
  "redis>=5.0",
  "structlog>=24",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "PyJWT>=2.9",
  "pwdlib[argon2]>=0.2",
  "pydantic[email]>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "pyright>=1.1.370",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
